    <script>
      // Synchronous pre-paint theme, text-scale, and PWA install prompt bootstrap (prevents FOUC on iOS/Android)
      (function() {
        try {
          var savedDark = localStorage.getItem('hiyori_theme_dark');
          if (savedDark === null) savedDark = localStorage.getItem('wayfarer_theme_dark');
          var isDark = savedDark !== null
            ? savedDark === 'true'
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          var bg = isDark ? '#090D16' : '#FAF9F6';
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          root.style.backgroundColor = bg;
          var metaTheme = document.getElementById('hiyori-theme-color');
          if (metaTheme) metaTheme.setAttribute('content', bg);

          var savedScale = localStorage.getItem('hiyori_accessibility_scale_v1');
          if (savedScale === 'comfortable' || savedScale === 'senior') {
            root.setAttribute('data-text-scale', savedScale);
          }

          var savedLang = localStorage.getItem('hiyori_lang') || localStorage.getItem('wayfarer_lang');
          if (savedLang) {
            var langMap = { zh: 'zh-TW', 'zh-CN': 'zh-CN', en: 'en', ja: 'ja', ko: 'ko' };
            if (langMap[savedLang]) root.lang = langMap[savedLang];
          }
        } catch (e) {}

        // Capture early beforeinstallprompt before React mounts
        window.__hiyoriDeferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__hiyoriDeferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('hiyori_install_prompt_ready'));
        });

        // Ignore noise strictly from browser extensions
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
