<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>日和手帳 Hiyori</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback: redirects 404 paths to index.html with query
      var segmentCount = 1;
      var loc = window.location;
      loc.replace(
        loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
        loc.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        loc.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (loc.search ? '&q=' + loc.search.slice(1).replace(/&/g, '~and~') : '') +
        loc.hash
      );
    </script>
  </head>
  <body>
    <p>正在載入日和手帳...</p>
  </body>
</html>
