<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="compass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Map Route Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Waypoint Pin glow -->
  <circle cx="256" cy="256" r="120" fill="rgba(45, 212, 191, 0.12)" />

  <!-- Stylized Compass / Waypoint Needle -->
  <g filter="url(#shadow)">
    <!-- North Needle (Teal-Cyan) -->
    <path d="M256 96 L298 256 L256 236 L214 256 Z" fill="url(#compass)" />
    <!-- South Needle (White) -->
    <path d="M256 416 L298 256 L256 236 L214 256 Z" fill="#ffffff" opacity="0.9" />
    <!-- Center Core -->
    <circle cx="256" cy="246" r="22" fill="#0f766e" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- Route Nodes -->
  <circle cx="120" cy="280" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="392" cy="230" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="96" r="12" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
</svg>
